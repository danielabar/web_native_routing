<section class="contact-page">
    <h1>Get In Touch</h1>

    <div class="contact-content">
        <div class="contact-info">
            <h2>Let's Connect</h2>
            <p>Interested in discussing web native development approaches? Have questions about this routing implementation? I'd love to hear from you.</p>

            <div class="contact-methods">
                <div class="contact-method">
                    <strong>Email</strong>
                    <p>hello@example.com</p>
                </div>
                <div class="contact-method">
                    <strong>GitHub</strong>
                    <p><a href="https://github.com" target="_blank" rel="noopener">View the source code</a></p>
                </div>
            </div>
        </div>

        <div class="contact-form-section">
            <h2>Send a Message</h2>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>
</section>
