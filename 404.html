<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Native Router</title>
    <script type="module">
        // SPA fallback - redirect to app base path
        import { basePath } from './js/base-path.js';

        // Store the intended URL
        sessionStorage.setItem('redirect', location.href);

        // Redirect to app base path
        location.replace(basePath);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
