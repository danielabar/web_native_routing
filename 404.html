<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Native Router</title>
    <script>
        // GitHub Pages SPA fallback
        // Store the current URL and redirect to the project base
        sessionStorage.redirect = location.href;

        // Detect base path from current URL
        var pathSegments = location.pathname.split('/');
        var basePath = '/';

        // For GitHub Pages: https://user.github.io/project/route -> base is /project/
        if (pathSegments.length >= 2 && pathSegments[1]) {
            basePath = '/' + pathSegments[1] + '/';
        }

        // Redirect to the base path
        location.replace(basePath);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
