<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native Routing SPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Vanilla JS static web app demonstrating client-side routing without SPA frameworks" />
    <script>
      // Detect application base path - works on any host
      // For GitHub Pages projects: detect if we're in a project subdirectory
      // For other hosts: assume root deployment unless detected otherwise
      const currentPath = window.location.pathname;
      let basePath = '/';

      // Check if this looks like a GitHub Pages project (path starts with repo name)
      if (window.location.hostname.includes('github.io') && currentPath !== '/') {
        const pathParts = currentPath.split('/').filter(Boolean);
        if (pathParts.length > 0) {
          basePath = '/' + pathParts[0] + '/';
        }
      }

      document.write('<base href="' + window.location.origin + basePath + '">');
    </script>
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>

    <!-- App root -->
    <main id="app">
      <!-- Views get injected here -->
    </main>

    <!-- App entry point -->
    <script type="module" src="app.js"></script>
  </body>
</html>
