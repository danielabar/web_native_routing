<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Native Routing Demo</title>
    <link rel="stylesheet" href="./css/styles.css">

    <!-- SPA fallback handler for 404.html redirects -->
    <script>
        // Handle redirect from 404.html for direct URL access
        (function() {
            var redirect = sessionStorage.getItem('redirect');
            sessionStorage.removeItem('redirect');
            if (redirect && redirect != location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="nav-brand">
                <h1>Web Native Router</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="nav-link" data-route>Home</a></li>
                <li><a href="/about" class="nav-link" data-route>About</a></li>
                <li><a href="/contact" class="nav-link" data-route>Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="content" class="main-content">
        <!-- Dynamic content will be loaded here -->
        <div class="loading">Loading...</div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Web Native Routing Demo</p>
    </footer>

    <script type="module" src="./js/router.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
